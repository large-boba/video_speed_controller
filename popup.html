<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Video Speed Controller</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <h1>Video Speed</h1>

    <div class="speed-display">
      <span id="speed-value">1.0</span><span class="x">x</span>
    </div>

    <input
      type="range"
      id="speed-slider"
      min="0.1"
      max="10"
      step="0.1"
      value="1"
      aria-label="Video playback speed"
    />

    <div class="range-labels">
      <span>0.1x</span>
      <span>10x</span>
    </div>

    <div class="presets">
      <button class="preset" data-speed="0.5">0.5x</button>
      <button class="preset" data-speed="1">1x</button>
      <button class="preset" data-speed="1.5">1.5x</button>
      <button class="preset" data-speed="2">2x</button>
      <button class="preset" data-speed="3">3x</button>
    </div>

    <button id="reset" class="reset">Reset to 1x</button>

    <p id="status" class="status"></p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
